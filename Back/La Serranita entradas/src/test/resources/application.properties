# Sólo para tests con contexto de Spring completo (@SpringBootTest, como
# LaSerranitaEntradasApplicationTests). Los tests unitarios con Mockito
# (CalculoPrecioServiceImplTest, CajaServiceImplTest, CompraServiceImplTest, etc.) no
# levantan contexto y no leen este archivo.
#
# Valores dummy: nunca apuntan a servicios reales, sólo permiten que arranquen los beans
# que exigen jwt.secret/mercadopago.accessToken/credenciales de mail sin default.

spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:h2:mem:testdb-app-context
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

jwt.secret=solo-para-tests-nunca-usar-en-produccion-0000000000000000
jwt.expiration-ms=43200000

mercadopago.accessToken=TEST-0000000000000000-000000-00000000000000000000000000000000-000000000
mercadopago.notification-url=
mercadopago.frontend-url=http://localhost:4200
mercadopago.webhook-secret=

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

cors.allowed-origins=http://localhost:4200
