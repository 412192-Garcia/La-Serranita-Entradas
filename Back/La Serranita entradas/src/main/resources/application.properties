spring.application.name=La Serranita entradas

# dev = H2 en memoria (default para levantar el proyecto sin instalar nada).
# prod = Postgres real (ver application-prod.properties). Se activa con la env var
# SPRING_PROFILES_ACTIVE=prod, típicamente seteada por docker-compose o el hosting.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
app.mail.copia=${MAIL_COPIA:}
# Casilla aparte para las facturas (otra cuenta del mismo servidor SMTP, salvo MAIL_FACTURAS_HOST/PORT).
# Vacío = las facturas salen de la casilla de reservas, como el resto de los mails.
app.mail.facturas.username=${MAIL_FACTURAS_USERNAME:}
app.mail.facturas.password=${MAIL_FACTURAS_PASSWORD:}
app.mail.facturas.host=${MAIL_FACTURAS_HOST:}
app.mail.facturas.port=${MAIL_FACTURAS_PORT:}
# Casilla de reservas (comprobantes de compra, avisos de regalo). MAIL_USERNAME/MAIL_PASSWORD son los
# nombres viejos y se siguen aceptando. Sin valor por defecto: si falta, la app no arranca.
spring.mail.username=${MAIL_RESERVAS_USERNAME:${MAIL_USERNAME}}
spring.mail.password=${MAIL_RESERVAS_PASSWORD:${MAIL_PASSWORD}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Teléfono/mail de contacto del parque que se muestran en los mails de comprobante (el
# remitente es una casilla no-reply, así que sin esto el cliente no tiene a dónde
# responder si necesita hacer un cambio o una consulta).
app.contacto.telefono=${CONTACTO_TELEFONO:+5493547642649}
app.contacto.email=${CONTACTO_EMAIL:info@laserranita.com.ar}

mercadopago.accessToken=${MP_ACCESS_TOKEN}
mercadopago.notification-url=${MP_NOTIFICATION_URL:}
# Origen público al que Mercado Pago redirige al usuario después de pagar (back_urls).
# A diferencia del webhook, esto lo visita el navegador del propio cliente: no depende
# de que el túnel de notificaciones (ngrok) esté levantado.
# OJO: Mercado Pago rechaza back_urls con "localhost" (con auto_return da 400; sin
# auto_return las ignora en silencio), así que en local no hay redirect — el pago
# sigue confirmándose por webhook y por el respaldo de verificación del polling.
mercadopago.frontend-url=${FRONTEND_URL:http://localhost:4200}
# Clave secreta de firma del webhook (header x-signature), separada del access token.
# Vacío por defecto: en ese caso el controller loguea un warning y deja pasar sin
# validar (para no romper el dev local, donde nunca se configuró). Obligatoria en prod.
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
# Detrás de Caddy + nginx: sin esto getRemoteAddr() devuelve la IP del nginx interno en vez
# de la del cliente (o de Mercado Pago, en el webhook).
server.forward-headers-strategy=native
# Nombre que aparece en el resumen de la tarjeta del cliente (máx. 13 caracteres, límite de Mercado Pago).
mercadopago.statement-descriptor=${MP_STATEMENT_DESCRIPTOR:LA SERRANITA}

# Sin valor por defecto a propósito (igual que el access token de Mercado Pago):
# la clave de firma vive en el .env, que está fuera del control de versiones.
# Si falta, la app no arranca en vez de firmar con una clave conocida.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}
# Duración del token cuando se marca "Mantener sesión iniciada" en el login (14 días por defecto).
jwt.remember-expiration-ms=${JWT_REMEMBER_EXPIRATION_MS:1209600000}

# Checkouts de Mercado Pago que quedan sin pagarse: un job los cancela pasadas estas horas
# (antes re-verifica contra MP por si el pago entró y el webhook nunca llegó) y devuelve el
# uso de cupón. Sin esto, un checkout abandonado bloquea para siempre un uso de cupón y lugar
# en el cupo diario. intervalo-ms = cada cuánto corre el chequeo.
compras.checkout-abandonado.horas=${CHECKOUT_ABANDONADO_HORAS:3}
compras.checkout-abandonado.intervalo-ms=${CHECKOUT_ABANDONADO_INTERVALO_MS:900000}

# Orígenes permitidos por CORS, separados por coma. En dev apunta al ng serve local;
# en producción se pisa con la env var CORS_ALLOWED_ORIGINS (el dominio real del front).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Evita el N+1 al serializar compras: las asociaciones LAZY (cliente, detalles,
# tipo de entrada, cupón, validador) se traen en lotes con un IN (...) en vez de
# una consulta por fila. Listar un día de reservas pasaba de ~125 SELECTs a unos pocos.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.sql.init.encoding=UTF-8

# --- Facturación electrónica (ARCA vía AfipSDK, https://afipsdk.com) ---
# Sin access token la facturación queda apagada: las ventas se registran igual, sin factura.
# En dev (homologación) alcanza con el token: se usa el CUIT de prueba de AfipSDK sin certificado.
afip.access-token=${AFIPSDK_ACCESS_TOKEN:}
# dev = homologación, prod = facturas reales.
afip.environment=${AFIP_ENVIRONMENT:dev}
afip.cuit=${AFIP_CUIT:20409378472}
# Certificado y clave privada de ARCA (PEM): el contenido o la ruta a un archivo. Sólo prod.
afip.cert=${AFIP_CERT:}
afip.key=${AFIP_KEY:}
# Punto de venta "Web Services" de la boletería. Tiene que ser distinto del 0010 de la cantina.
afip.punto-venta.boleteria=${AFIP_PUNTO_VENTA_BOLETERIA:1}
# Punto de venta de las compras online pagadas con Mercado Pago (se facturan solas, por mail).
# Vacío = no se facturan. Las reservas a pagar en puerta se facturan en el POS al cobrarlas.
afip.punto-venta.online=${AFIP_PUNTO_VENTA_ONLINE:}
# Cada cuánto se reintentan las facturas que quedaron pendientes (ARCA caída, sin internet).
afip.emision.intervalo-ms=${AFIP_EMISION_INTERVALO_MS:60000}
# Datos del emisor que se imprimen en la factura (PDF y ticket). El CUIT sale de AFIP_CUIT.
afip.emisor.razon-social=${AFIP_EMISOR_RAZON_SOCIAL:PARQUE RECREATIVO LA SERRANITA S.A.S.}
afip.emisor.domicilio=${AFIP_EMISOR_DOMICILIO:RUTA 5 KM43,5}
afip.emisor.ingresos-brutos=${AFIP_EMISOR_INGRESOS_BRUTOS:287116730}
afip.emisor.inicio-actividades=${AFIP_EMISOR_INICIO_ACTIVIDADES:30/11/2020}

# --- Impresión en la ticketera de la boletería (agente en la PC de la entrada) ---
# Token compartido con el agente (agente.properties). Vacío = el agente no se puede conectar.
# Generar con: openssl rand -base64 32
# Monitoreo (Sistema > Estado): carpeta de backups montada en el backend (sólo lectura), días sin
# backup para avisar, diferencia de caja que se considera grande y logins fallidos por usuario en 24 h.
app.backups.dir=${BACKUPS_DIR:/backups}
app.monitoreo.dias-sin-backup=${MONITOREO_DIAS_SIN_BACKUP:8}
app.monitoreo.diferencia-caja=${MONITOREO_DIFERENCIA_CAJA:10000}
app.monitoreo.logins-fallidos=${MONITOREO_LOGINS_FALLIDOS:5}
# Historial de acciones: cuánto se guarda.
app.auditoria.retencion-dias=${AUDITORIA_RETENCION_DIAS:730}
# Requests que tardan más que esto cuentan como lentas (Sistema > Rendimiento, y van al log); con
# lentas-por-hora o más en la última hora, la tarjeta se pone en rojo.
app.monitoreo.request-lenta-ms=${MONITOREO_REQUEST_LENTA_MS:3000}
app.monitoreo.lentas-por-hora=${MONITOREO_LENTAS_POR_HORA:20}
# Terminales del POS: sin latido en este tiempo con ventas sin subir = se quedó sin conexión; una
# operación pendiente más vieja que minutos-cola-trabada con la terminal conectada = cola trabada.
app.monitoreo.minutos-terminal-sin-latido=${MONITOREO_MINUTOS_TERMINAL_SIN_LATIDO:10}
app.monitoreo.minutos-cola-trabada=${MONITOREO_MINUTOS_COLA_TRABADA:15}
# Una tarea programada corriendo hace más que esto se considera trabada.
app.monitoreo.minutos-tarea-trabada=${MONITOREO_MINUTOS_TAREA_TRABADA:15}
# Alertas fuera de la app (ver AlertasService). Mail: uno o varios separados por coma; vacío = sin
# mails. Latido: URL que se visita cada 5 min con el backend y la base andando (ej. un check de
# healthchecks.io), que avisa si deja de llegar; vacío = sin latido.
app.alertas.mail=${ALERTAS_MAIL:}
app.alertas.latido-url=${ALERTAS_LATIDO_URL:}
app.alertas.recordatorio-horas=${ALERTAS_RECORDATORIO_HORAS:24}
app.alertas.avisar-arranque=${ALERTAS_AVISAR_ARRANQUE:true}
# Sistema > Estado > Ventas (ver AnomaliasVentas): ventana para "sin ventas online", lo normal mínimo
# para que 0 sea raro, checkouts mínimos y % pagado por debajo del que se avisa, pagos mínimos en 24 h
# para juzgar el webhook, y movimiento en la puerta (por hora) para que el otro lado en 0 sea raro.
app.monitoreo.ventas.ventana-horas=${MONITOREO_VENTAS_VENTANA_HORAS:3}
app.monitoreo.ventas.minimo-esperado=${MONITOREO_VENTAS_MINIMO_ESPERADO:3}
app.monitoreo.ventas.minimo-checkouts=${MONITOREO_VENTAS_MINIMO_CHECKOUTS:6}
app.monitoreo.ventas.conversion-minima=${MONITOREO_VENTAS_CONVERSION_MINIMA:20}
app.monitoreo.ventas.minimo-confirmaciones=${MONITOREO_VENTAS_MINIMO_CONFIRMACIONES:4}
app.monitoreo.ventas.movimiento-puerta=${MONITOREO_VENTAS_MOVIMIENTO_PUERTA:15}
# Copia de los backups en Google Drive (la hace el contenedor "backup" con rclone): si está
# configurada, la tarjeta de Backups avisa cuando la última copia falló o es vieja.
app.backups.drive-remoto=${BACKUP_DRIVE_REMOTO:}
# Cada línea del log lleva el id de la request que la generó (ver MetricasRequestsFilter).
logging.pattern.correlation=[%X{requestId:-}] 
# Logs en JSON (formato ECS) para mandarlos a Grafana Loki: LOG_FORMATO=ecs. Vacío = texto común,
# más cómodo para leer con "docker compose logs". El requestId y el usuario van como campos.
logging.structured.format.console=${LOG_FORMATO:}

# --- Métricas (Actuator + Prometheus, para Grafana) ---
# Puerto aparte, sólo dentro de la red de Docker: no se publica ni pasa por Caddy, así las métricas
# no quedan en internet. NUNCA ponerlo igual a server.port (quedarían públicas).
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# La salud de "la app sirve" es /api/salud; el mail caído no tiene que dar la app por caída.
management.health.mail.enabled=false
management.metrics.tags.application=serranita
# Histogramas de tiempos por endpoint: con esto Grafana calcula p95/p99 y no sólo el promedio.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
impresion.agente.token=${IMPRESION_AGENTE_TOKEN:}
# Caracteres por línea del ticket: 48 en papel de 80 mm, 32 en 58 mm.
impresion.columnas=${IMPRESION_COLUMNAS:48}
# QR del ticket: "nativo" = lo dibuja la ticketera (se lee mucho mejor en la SOL 802); "imagen" = se
# manda como imagen, para una ticketera sin el comando de QR.
impresion.qr-modo=${IMPRESION_QR_MODO:nativo}
# Tamaño de cada cuadradito del QR, en puntos de impresora (1 a 16). El QR de ARCA es muy denso:
# cuadraditos más grandes = más fácil de escanear. 6 = QR de ~43 mm.
impresion.qr-puntos-por-modulo=${IMPRESION_QR_PUNTOS:6}
# Un ticket que no se pudo imprimir en este tiempo se da por perdido (se reimprime a mano).
impresion.minutos-vencimiento=${IMPRESION_MINUTOS_VENCIMIENTO:15}
# Sin noticias del agente en este tiempo = PC de la entrada apagada (el agente informa cada 15 s).
impresion.segundos-sin-noticias=${IMPRESION_SEGUNDOS_SIN_NOTICIAS:35}

# Hilos para las tareas programadas. Por defecto Spring usa UNO solo para todas: un reintento de
# facturas esperando a ARCA (hasta 40 s por llamada) frenaba el latido a los agentes de
# impresión, que se desconectan a los 65 s sin noticias. Cada tarea igual nunca se superpone
# consigo misma (fixedDelay espera a que termine la pasada anterior).
spring.task.scheduling.pool.size=${SCHEDULING_POOL_SIZE:4}
