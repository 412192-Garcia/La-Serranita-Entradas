spring.application.name=La Serranita entradas


spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

server.port=8080

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

mercadopago.accessToken=${MP_ACCESS_TOKEN}
mercadopago.notification-url=${MP_NOTIFICATION_URL:}

# Sin valor por defecto a propósito (igual que el access token de Mercado Pago):
# la clave de firma vive en el .env, que está fuera del control de versiones.
# Si falta, la app no arranca en vez de firmar con una clave conocida.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Evita el N+1 al serializar compras: las asociaciones LAZY (cliente, detalles,
# tipo de entrada, cupón, validador) se traen en lotes con un IN (...) en vez de
# una consulta por fila. Listar un día de reservas pasaba de ~125 SELECTs a unos pocos.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
