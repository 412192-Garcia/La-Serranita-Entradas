# Perfil de producción: Postgres real, persistente. Se activa con SPRING_PROFILES_ACTIVE=prod.
#
# DB_URL tiene que ser una URL JDBC completa, por ejemplo:
#   jdbc:postgresql://db:5432/serranita
# Si el hosting sólo da una connection string tipo "postgres://user:pass@host/db"
# (Heroku/Railway/Supabase la suelen dar así), hay que convertirla a formato JDBC:
# jdbc:postgresql://host/db?user=...&password=... (Spring/Hikari no entiende el
# esquema "postgres://" directamente).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# "update" en vez de "validate": no hay herramienta de migraciones (Flyway/Liquibase)
# todavía, así que Hibernate crea/ajusta las tablas solo a partir de las entidades.
# Es cómodo para arrancar, pero no valida los cambios de esquema como lo haría una
# migración versionada — para un proyecto que va a crecer, migrar a Flyway más
# adelante es lo recomendable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# data.sql (usuarios y datos de prueba) NO se ejecuta en producción: son credenciales
# de desarrollo. El primer usuario ADMIN se crea con el bootstrap (ver
# BootstrapAdminRunner) seteando BOOTSTRAP_ADMIN_USERNAME/BOOTSTRAP_ADMIN_PASSWORD.
spring.sql.init.mode=never

spring.h2.console.enabled=false

logging.level.root=WARN
logging.level.org.example.laserranitaentradas=INFO
