# Perfil de desarrollo: todo en memoria, sin instalar nada. Los datos se pierden
# en cada reinicio a propósito (ver data.sql), así que nunca usar este perfil en producción.

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

logging.level.org.example.laserranitaentradas=DEBUG
