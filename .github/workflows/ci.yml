name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Back/La Serranita entradas"
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar y correr tests
        run: ./mvnw -B verify

  frontend:
    name: Frontend (build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Front/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeo de tipos
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build de producción
        run: npx ng build --configuration production

  # Arma las 3 imágenes de docker-compose.yml y las sube a GitHub Container Registry.
  # Así el despliegue (VPS, o paneles tipo "pegá la URL del compose") sólo necesita
  # bajar imágenes ya construidas, no clonar el repo entero ni compilar nada ahí.
  publish-images:
    name: Publicar imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push — backend
        uses: docker/build-push-action@v6
        with:
          context: "./Back/La Serranita entradas"
          push: true
          tags: ghcr.io/412192-garcia/la-serranita-backend:latest

      - name: Build y push — frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Front
          push: true
          tags: ghcr.io/412192-garcia/la-serranita-frontend:latest

      - name: Build y push — caddy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.caddy
          push: true
          tags: ghcr.io/412192-garcia/la-serranita-caddy:latest
