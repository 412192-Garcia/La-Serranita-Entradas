# Sirve el build de Angular y reenvía /api al contenedor del backend (nombre de
# servicio "backend" en docker-compose.yml, puerto 8080). Si el backend corre en otro
# lugar (sin docker-compose), cambiar el "proxy_pass" de abajo por su URL real.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Los archivos con hash en el nombre (main-XXXX.js) pueden cachearse para siempre;
    # index.html no, porque es el que decide qué hash de bundle cargar en cada deploy.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas de Angular (SPA): cualquier ruta que no matchee un archivo real cae en
    # index.html y el router de Angular decide qué mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
