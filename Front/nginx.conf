# Sirve el build de Angular y reenvía /api al contenedor del backend (nombre de
# servicio "backend" en docker-compose.yml, puerto 8080). Si el backend corre en otro
# lugar (sin docker-compose), cambiar el "proxy_pass" de abajo por su URL real.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Sólo los archivos con hash en el nombre (main-XXXXXXXX.js, media/) se guardan para siempre.
    # El resto (index.html, ngsw-worker.js, íconos) se revalida en cada carga: ver "location /".
    # Entre comillas: sin ellas nginx toma la { de {8} como inicio de bloque y no arranca.
    location ~ "(?:-[A-Z0-9]{8}\.(?:js|css)$|^/media/)" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Conexión SSE del agente de impresión: queda abierta indefinidamente y los tickets tienen
    # que llegar en el momento, así que sin buffer y sin cortarla por inactividad (el backend
    # manda un latido cada 20 s igual).
    location /api/impresion/agente/ {
        proxy_pass http://backend:8080/api/impresion/agente/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas de Angular (SPA): cualquier ruta que no matchee un archivo real cae en
    # index.html y el router de Angular decide qué mostrar.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
