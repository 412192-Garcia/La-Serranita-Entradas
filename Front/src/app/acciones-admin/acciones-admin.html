<div class="panel">

  <app-cabecera-interna
    titulo="Acciones de admin"
    descripcion="Herramientas puntuales del administrador: generar una reserva manual, facturar, controlar la facturación o resolver operaciones rechazadas."
    [pasosTutorial]="pasosTutorial()" />

  <nav class="tabs">
    <button type="button" class="tab" [class.activo]="tab() === 'reserva'" (click)="tab.set('reserva')">
      Generar reserva
    </button>
    <button type="button" class="tab" [class.activo]="tab() === 'factura'" (click)="tab.set('factura')">
      Facturación manual
    </button>
    <button type="button" class="tab" [class.activo]="tab() === 'control'" (click)="tab.set('control')">
      Control de facturas
      @if (hayAvisoFacturacion()) {
        <span class="punto-notificacion-tab" aria-label="Hay algo para revisar en la facturación"></span>
      }
    </button>
    <button type="button" class="tab" [class.activo]="tab() === 'rechazos'" (click)="tab.set('rechazos')">
      Operaciones rechazadas
      @if (hayRechazosPendientes()) {
        <span class="punto-notificacion-tab" aria-label="Hay operaciones rechazadas pendientes"></span>
      }
    </button>
  </nav>

  @if (tab() === 'reserva') {
    <app-crear-reserva />
  } @else if (tab() === 'factura') {
    <app-facturacion-manual />
  } @else if (tab() === 'control') {
    <app-control-facturas />
  } @else {
    <app-rechazos-operaciones />
  }

</div>
