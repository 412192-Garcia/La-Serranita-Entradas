
<router-outlet />

@if (actualizacionDisponible() && !rutaPublica()) {
  <div class="banner-actualizacion">
    <span>Hay una versión nueva disponible.</span>
    <button type="button" (click)="actualizar()" [disabled]="actualizando()">
      {{ actualizando() ? 'Actualizando…' : 'Actualizar' }}
    </button>
  </div>
}
