<header class="cabecera">
  <div class="cabecera-texto">
    <h1>{{ titulo }}</h1>
    @if (descripcion) {
      <p>{{ descripcion }}</p>
    }
  </div>

  <div class="cabecera-acciones">
    @for (e of enlacesVisibles; track e.ruta) {
      <a class="btn-secundario" [routerLink]="e.ruta">{{ e.texto }}</a>
    }
    @if (operador(); as usuario) {
      <span class="operador">{{ usuario.nombre }}</span>
      <button type="button" class="btn-secundario" (click)="cerrarSesion()">Cerrar sesión</button>
    }
  </div>
</header>
