<app-modal (cerrar)="cerrar.emit()">
  <div class="panel-caja">
    <h3>{{ tipo() === 'APORTE' ? 'Agregar plata' : 'Retirar efectivo' }}</h3>

    <div class="grupo-toggle-pill">
      <button type="button" class="btn-toggle-pill" [class.activo]="tipo() === 'RETIRO'" (click)="tipo.set('RETIRO')">Retiro</button>
      <button type="button" class="btn-toggle-pill" [class.activo]="tipo() === 'APORTE'" (click)="tipo.set('APORTE')">Aporte</button>
    </div>

    <div class="fila-panel-caja">
      <label>
        Monto
        <input
          type="text"
          inputmode="numeric"
          placeholder="0"
          appMoneyInput
          [ngModel]="monto()"
          (ngModelChange)="monto.set($event)" />
      </label>
      <label class="campo-motivo">
        Motivo
        <input
          type="text"
          placeholder="Ej: resguardo en caja fuerte"
          [ngModel]="motivo()"
          (ngModelChange)="motivo.set($event)" />
      </label>
    </div>
    @if (error()) {
      <p class="alerta-error">{{ error() }}</p>
    }
    <div class="acciones">
      <button type="button" class="btn-limpiar" (click)="cerrar.emit()">Cancelar</button>
      <button type="button" class="btn-cobrar" [disabled]="registrando()" (click)="confirmar()">
        @if (registrando()) {
          Registrando…
        } @else {
          {{ tipo() === 'APORTE' ? 'Confirmar aporte' : 'Confirmar retiro' }}
        }
      </button>
    </div>

    @if (retiros().length) {
      <ul class="lista-retiros">
        @for (r of retiros(); track r.id) {
          <li [class.item-retiro]="r.tipo === 'RETIRO'" [class.item-aporte]="r.tipo === 'APORTE'">
            <span>{{ r.tipo === 'APORTE' ? '+ ' : '− ' }}{{ r.motivo }}</span>
            <span>{{ r.monto | pesos }}</span>
          </li>
        }
      </ul>
    }
  </div>
</app-modal>
