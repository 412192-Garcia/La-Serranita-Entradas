<div class="pago-fallido-card">
  <div class="icono-fallido">
    <svg lucideCircleX [strokeWidth]="2.5"></svg>
  </div>

  <h3>El pago no pudo procesarse</h3>
  <p>Ocurrió un inconveniente al intentar cobrar tu entrada o cancelaste la operación.</p>

  @if (codigoReserva) {
    <div class="referencia-compra">
      Referencia de compra: <strong>#{{ codigoReserva }}</strong>
    </div>
  }

  <p>Podés volver a intentarlo desde la página de compra, con otro medio de pago si hace falta.</p>

  <div class="footer-acciones">
    <button type="button" class="btn-primario" (click)="cerrar()">
      {{ esPopup ? 'Cerrar' : 'Volver al sitio del parque' }}
    </button>
  </div>
</div>
