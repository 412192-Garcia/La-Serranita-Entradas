<div class="pago-exitoso-card">
  <div class="icono-exito">
    <svg lucideCircleCheck [strokeWidth]="2.5"></svg>
  </div>
  <h3>¡Compra confirmada! 🎉</h3>
  <p>Tu orden <strong>#{{ codigoReserva }}</strong> ya está lista.</p>

  <div class="mensaje-dni-ingreso">
    <p>🪪 <strong>¡Ingreso simplificado!</strong></p>
    <p>Al llegar al parque, solo tenés que presentar el DNI <strong>{{ compraAcumulada.cliente?.dni }}</strong> en el acceso para ingresar con todo tu grupo.</p>
  </div>
</div>
