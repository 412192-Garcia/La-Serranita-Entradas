<div class="panel" [class.seccion-abierta]="seccionAbierta()">

  <app-cabecera-interna
    titulo="Sistema"
    descripcion="Estado del sistema, historial, errores y módulos."
    [pasosTutorial]="pasosTutorial()"
    (tutorialIniciado)="seccionAbierta.set(true)" />

  <nav class="tabs">
    <button type="button" class="tab" [class.activo]="tab() === 'estado'" (click)="elegir('estado')"><svg lucideActivity class="icono-seccion" [strokeWidth]="2" aria-hidden="true"></svg>Estado</button>
    <button type="button" class="tab" [class.activo]="tab() === 'historial'" (click)="elegir('historial')"><svg lucideHistory class="icono-seccion" [strokeWidth]="2" aria-hidden="true"></svg>Historial de acciones</button>
    <button type="button" class="tab" [class.activo]="tab() === 'errores'" (click)="elegir('errores')"><svg lucideTriangleAlert class="icono-seccion" [strokeWidth]="2" aria-hidden="true"></svg>Errores</button>
    <button type="button" class="tab" [class.activo]="tab() === 'rendimiento'" (click)="elegir('rendimiento')"><svg lucideGauge class="icono-seccion" [strokeWidth]="2" aria-hidden="true"></svg>Rendimiento</button>
    <button type="button" class="tab" [class.activo]="tab() === 'rechazos'" (click)="elegir('rechazos')"><svg lucideBan class="icono-seccion" [strokeWidth]="2" aria-hidden="true"></svg>
      Operaciones rechazadas
      @if (hayRechazosPendientes()) {
        <span class="punto-notificacion-tab" aria-label="Hay operaciones rechazadas pendientes"></span>
      }
    </button>
    <button type="button" class="tab" [class.activo]="tab() === 'modulos'" (click)="elegir('modulos')"><svg lucideToggleRight class="icono-seccion" [strokeWidth]="2" aria-hidden="true"></svg>Módulos</button>
  </nav>

  <button type="button" class="btn-volver-seccion" (click)="seccionAbierta.set(false)">
    <svg lucideArrowLeft [strokeWidth]="2" aria-hidden="true"></svg>
    Volver a secciones
  </button>

  @if (tab() === 'estado') {
    <app-estado-sistema />
  } @else if (tab() === 'historial') {
    <app-historial-acciones [accionInicial]="accionInicial()" />
  } @else if (tab() === 'errores') {
    <app-errores-sistema [areaInicial]="areaInicial()" />
  } @else if (tab() === 'rendimiento') {
    <app-rendimiento-sistema />
  } @else if (tab() === 'rechazos') {
    <app-rechazos-operaciones />
  } @else {
    <app-modulos-sistema />
  }
</div>
