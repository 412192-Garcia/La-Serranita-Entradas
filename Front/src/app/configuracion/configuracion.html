<div class="panel">

  <app-cabecera-interna
    titulo="Configuración del Parque"
    descripcion="Días abiertos, horarios y cupones de descuento."
    [enlace]="enlaceBoleteria" />

  <nav class="tabs">
    <button type="button" class="tab" [class.activo]="tab() === 'dias'" (click)="tab.set('dias')">
      Días y Horarios
    </button>
    <button type="button" class="tab" [class.activo]="tab() === 'cupones'" (click)="tab.set('cupones')">
      Cupones
    </button>
    <button type="button" class="tab" [class.activo]="tab() === 'tipos'" (click)="tab.set('tipos')">
      Tipos de Entrada
    </button>
    <button type="button" class="tab" [class.activo]="tab() === 'reportes'" (click)="tab.set('reportes')">
      Reportes
    </button>
    <button type="button" class="tab" [class.activo]="tab() === 'usuarios'" (click)="tab.set('usuarios')">
      Usuarios
    </button>
  </nav>

  @if (tab() === 'dias') {
    <app-configuracion-dias-horarios />
  } @else if (tab() === 'cupones') {
    <app-configuracion-cupones />
  } @else if (tab() === 'tipos') {
    <app-configuracion-tipos-entrada />
  } @else if (tab() === 'reportes') {
    <app-configuracion-reportes />
  } @else if (tab() === 'usuarios') {
    <app-configuracion-usuarios />
  }

</div>
