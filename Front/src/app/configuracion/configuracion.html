<div class="panel" [class.seccion-abierta]="seccionAbierta()">

  <app-cabecera-interna
    titulo="Configuración del Parque"
    descripcion="Días abiertos, horarios y cupones de descuento."
    [pasosTutorial]="pasosTutorial()"
    (tutorialIniciado)="seccionAbierta.set(true)" />

  <nav class="tabs">
    <button type="button" class="tab" [class.activo]="tab() === 'dias'" (click)="tab.set('dias'); seccionAbierta.set(true)">
      <svg lucideCalendarDays class="icono-seccion" [strokeWidth]="2" aria-hidden="true"></svg>
      Días y Horarios
    </button>
    <button type="button" class="tab" [class.activo]="tab() === 'descuentos'" (click)="tab.set('descuentos'); seccionAbierta.set(true)">
      <svg lucidePercent class="icono-seccion" [strokeWidth]="2" aria-hidden="true"></svg>
      Descuentos
    </button>
    <button type="button" class="tab" [class.activo]="tab() === 'catalogo'" (click)="tab.set('catalogo'); seccionAbierta.set(true)">
      <svg lucideTicket class="icono-seccion" [strokeWidth]="2" aria-hidden="true"></svg>
      Catálogo
    </button>
    <button type="button" class="tab" [class.activo]="tab() === 'usuarios'" (click)="tab.set('usuarios'); seccionAbierta.set(true)">
      <svg lucideUsers class="icono-seccion" [strokeWidth]="2" aria-hidden="true"></svg>
      Usuarios
    </button>
    <button type="button" class="tab" [class.activo]="tab() === 'cobros'" (click)="tab.set('cobros'); seccionAbierta.set(true)">
      <svg lucideCreditCard class="icono-seccion" [strokeWidth]="2" aria-hidden="true"></svg>
      Cobros
    </button>
  </nav>

  <button type="button" class="btn-volver-seccion" (click)="seccionAbierta.set(false)">
    <svg lucideArrowLeft [strokeWidth]="2" aria-hidden="true"></svg>
    Volver a secciones
  </button>

  @if (tab() === 'dias') {
    <app-configuracion-dias-horarios />
  } @else if (tab() === 'descuentos') {
    <app-configuracion-promociones data-tour="promociones" />
    <app-configuracion-cupones data-tour="cupones" />
  } @else if (tab() === 'catalogo') {
    <app-configuracion-tipos-entrada data-tour="tipos-entrada" />
    <app-configuracion-articulos data-tour="articulos-varios" />
  } @else if (tab() === 'usuarios') {
    <app-configuracion-usuarios data-tour="usuarios" />
  } @else if (tab() === 'cobros') {
    <app-configuracion-factura-predeterminada />
    <app-configuracion-points />
  }

</div>
