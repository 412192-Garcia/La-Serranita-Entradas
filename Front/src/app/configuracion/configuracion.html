<div class="panel">

  <app-cabecera-interna
    titulo="Configuración del Parque"
    descripcion="Días abiertos, horarios y cupones de descuento."
    [pasosTutorial]="pasosTutorial()" />

  <nav class="tabs">
    <button type="button" class="tab" [class.activo]="tab() === 'dias'" (click)="tab.set('dias')">
      Días y Horarios
    </button>
    <button type="button" class="tab" [class.activo]="tab() === 'descuentos'" (click)="tab.set('descuentos')">
      Descuentos
    </button>
    <button type="button" class="tab" [class.activo]="tab() === 'catalogo'" (click)="tab.set('catalogo')">
      Catálogo
    </button>
    <button type="button" class="tab" [class.activo]="tab() === 'usuarios'" (click)="tab.set('usuarios')">
      Usuarios
    </button>
  </nav>

  @if (tab() === 'dias') {
    <app-configuracion-dias-horarios />
  } @else if (tab() === 'descuentos') {
    <app-configuracion-promociones data-tour="promociones" />
    <app-configuracion-cupones data-tour="cupones" />
  } @else if (tab() === 'catalogo') {
    <app-configuracion-tipos-entrada data-tour="tipos-entrada" />
    <app-configuracion-articulos data-tour="articulos-varios" />
  } @else if (tab() === 'usuarios') {
    <app-configuracion-usuarios data-tour="usuarios" />
  }

</div>
