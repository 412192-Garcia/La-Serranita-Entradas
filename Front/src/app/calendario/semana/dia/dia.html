<div class="dia-contenedor" (click)="onDiaClick()">
  @if (dia.numero)
  {
    <button
      type="button"
      class="btn-dia"
      [ngClass]="clasesEstado"
      [class.dia-hoy]="dia.esHoy"
      [disabled]="dia.esPasado || !dia.abierto || dia.esHoy">
      {{dia.numero}}
    </button>
  } @else {
    <div class="celda-vacia"></div>
  }
</div>
