<div class="bloque-agregar-articulo">
  <button type="button" class="btn-secundario-caja" (click)="toggle()">
    {{ mostrarPanel() ? 'Cancelar' : '+ Agregar artículo' }}
  </button>

  @if (mostrarPanel()) {
    <div class="panel-agregar-articulo">
      <select aria-label="Elegí un artículo" [ngModel]="seleccion()" (ngModelChange)="elegirOpcion($event)">
        <option [ngValue]="null">Elegí un artículo…</option>
        @for (a of catalogoActivo(); track a.id) {
          <option [ngValue]="a.id">{{ a.nombre }}</option>
        }
        <option [ngValue]="'libre'">Otro (especificar)…</option>
      </select>

      @if (seleccion() === 'libre') {
        <label>
          Descripción
          <input type="text" placeholder="Ej: Cuadrito souvenir" [ngModel]="libreDescripcion()" (ngModelChange)="libreDescripcion.set($event)" />
        </label>
        <label>
          Precio
          <input
            type="text"
            inputmode="numeric"
            appMoneyInput
            [ngModel]="librePrecio()"
            (ngModelChange)="librePrecio.set($event)" />
        </label>
      } @else if (seleccion() !== null) {
        <label>
          Precio
          @if (precioBloqueado()) {
            <span class="precio-catalogo-fijo">{{ catalogoPrecio() | pesos }}</span>
          } @else {
            <input
              type="text"
              inputmode="numeric"
              appMoneyInput
              placeholder="Este artículo todavía no tiene precio cargado"
              [ngModel]="catalogoPrecio()"
              (ngModelChange)="catalogoPrecio.set($event)" />
          }
        </label>
      }

      <label>
        Cantidad
        <div class="stepper">
          <button type="button" class="btn-cant" (click)="decrementarCantidad()" aria-label="Restar uno">−</button>
          <input
            type="text"
            inputmode="numeric"
            class="stepper-input"
            aria-label="Cantidad"
            [ngModel]="cantidad()"
            (ngModelChange)="setCantidad($event)" />
          <button type="button" class="btn-cant" (click)="incrementarCantidad()" aria-label="Sumar uno">+</button>
        </div>
      </label>

      <button type="button" class="btn-cobrar" (click)="confirmar()">Agregar al carrito</button>
    </div>
  }
</div>
