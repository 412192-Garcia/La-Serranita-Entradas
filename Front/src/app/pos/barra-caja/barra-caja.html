<!-- Sólo el estado de sincronización de la cola offline. Retiro/Aporte y Reponer talonario
     viven ahora en la cabecera. Los totales de la caja no se muestran hasta el cierre: es lo
     que el boletero tiene que contar a ciegas. -->
@if (pendientes() > 0 || conError().length > 0) {
  <div class="barra-caja">
    @if (pendientes() > 0) {
      <span class="chip-pendientes" title="Se registran solas cuando vuelva la señal">
        <svg lucideCloudOff [strokeWidth]="2"></svg>
        {{ pendientes() }} {{ pendientes() === 1 ? 'operación' : 'operaciones' }} por sincronizar
      </span>
    }
    @if (conError().length > 0) {
      <span class="chip-error-sincro" [title]="conError()[0].mensajeError ?? ''">
        <svg lucideTriangleAlert [strokeWidth]="2"></svg>
        {{ conError().length }} con error — queda registrado para el admin en Cajas
      </span>
      <button type="button" class="btn-descartar-error" (click)="descartarErrores()">Descartar</button>
    }
  </div>
}
