<div class="comprobante comprobante-apertura">
  <svg lucideLockOpen class="comprobante-icono" [strokeWidth]="1.5"></svg>
  <h2>Abrir caja</h2>
  <p class="subtitulo-apertura">Contá los billetes con los que arranca el turno.</p>

  <div class="lista-denominaciones lista-denominaciones-apertura">
    @for (d of denominaciones; track d) {
      <label class="fila-denominacion">
        <span>{{ d | pesos }}</span>
        <input
          type="number"
          min="0"
          inputmode="numeric"
          placeholder="0"
          [ngModel]="conteoEfectivo()[d]"
          (ngModelChange)="setConteoEfectivo(d, $event ?? 0)" />
      </label>
    }
    <label class="fila-denominacion fila-cambio">
      <span>Cambio</span>
      <input
        type="text"
        inputmode="numeric"
        placeholder="0"
        appMoneyInput
        [ngModel]="cambioApertura()"
        (ngModelChange)="cambioApertura.set($event)" />
    </label>
  </div>

  <div class="total-efectivo-contado total-efectivo-apertura">
    <span>Efectivo inicial</span>
    <strong>{{ montoAperturaCalculado() | pesos }}</strong>
  </div>

  <label class="campo-apertura">
    ¿Con cuántas entradas empieza?
    <input
      type="number"
      min="0"
      inputmode="numeric"
      placeholder="0"
      [ngModel]="entradasFisicasApertura()"
      (ngModelChange)="entradasFisicasApertura.set($event)" />
  </label>

  @if (errorApertura()) {
    <p class="alerta-error">{{ errorApertura() }}</p>
  }

  <button type="button" class="btn-nueva-venta" [disabled]="abriendoCaja()" (click)="abrirCaja()">
    {{ abriendoCaja() ? 'Abriendo…' : 'Abrir caja' }}
  </button>
</div>
