<div class="panel-pos">

  <app-cabecera-interna
    titulo="Venta en Boletería"
    descripcion="Cobrá y registra la compra."
    [pasosTutorial]="pasosTutorial" />

  @if (cargandoCaja()) {
    <app-spinner />
  } @else if (caja() === null) {
    <app-apertura-caja (cajaAbierta)="onCajaAbierta($event)" />
  } @else {

    <app-barra-caja
      data-tour="barra-caja"
      [caja]="caja()!"
      (retirarEfectivo)="mostrarRetiro.set(true)"
      (agregarEntradas)="mostrarIngresoEntradas.set(true)" />

    <!-- Los dos son modales: no empujan el mostrador de venta, y al taparlo de paso
         evitan seguir cobrando hacia una caja que se está por retirar. -->
    @if (mostrarRetiro()) {
      <app-retiro-efectivo-modal
        [retiros]="caja()!.retiros"
        (retiroRegistrado)="onRetiroRegistrado($event)"
        (retiroEncolado)="onRetiroEncolado($event)"
        (cerrar)="mostrarRetiro.set(false)" />
    }

    @if (mostrarIngresoEntradas()) {
      <app-ingreso-entradas-modal
        [ingresos]="caja()!.ingresosEntradas"
        (ingresoRegistrado)="onIngresoEntradasRegistrado($event)"
        (ingresoEncolado)="onIngresoEntradasEncolado($event)"
        (cerrar)="mostrarIngresoEntradas.set(false)" />
    }

    @if (ultimaVenta(); as venta) {
      <app-comprobante-venta
        [venta]="venta.venta"
        [formaPago]="venta.formaPago"
        [vuelto]="venta.vuelto"
        [items]="venta.items"
        [pendiente]="venta.pendiente"
        (nuevaVenta)="nuevaVenta()" />
    } @else {

      @if (errorCarga()) {
        <p class="alerta-error">{{ errorCarga() }}</p>
      }

      @if (cargando()) {
        <app-spinner />
      } @else {
        <div class="pos-layout">

          <!-- ============ CATÁLOGO ============ -->
          <section class="catalogo">
            <app-catalogo-entradas
              data-tour="catalogo"
              [entradas]="tiposEntrada()"
              [cantidades]="cantidades()"
              (cantidadesChange)="cantidades.set($event)" />

            <app-agregar-articulo data-tour="agregar-articulo" [catalogo]="articulosCatalogo()" (articuloAgregado)="onArticuloAgregado($event)" />
          </section>

          <!-- ============ CARRITO Y COBRO ============ -->
          <app-carrito-venta
            data-tour="carrito"
            [tiposEntrada]="tiposEntrada()"
            [cantidades]="cantidades()"
            [articulosCarrito]="articulosCarrito()"
            [promociones]="promociones()"
            [descuentosEfectivo]="descuentosEfectivo()"
            (quitarArticulo)="onQuitarArticulo($event)"
            (limpiar)="onLimpiar()"
            (ventaRegistrada)="onVentaRegistrada($event)" />

        </div>
      }
    }
  }
</div>
