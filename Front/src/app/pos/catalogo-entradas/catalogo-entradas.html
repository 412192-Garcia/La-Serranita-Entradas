@for (t of entradas(); track t.id) {
  @if (tienePreciosPorGrupo(t.id)) {
    <!-- Tiene precio por grupo: un toque elige la cantidad exacta; tocar la misma la vacía. -->
    <div class="selector-tipo">
      <div class="selector-header">
        <span class="selector-nombre">{{ t.nombre }}</span>
        <span class="selector-precio">{{ t.precio | pesos }} c/u</span>
      </div>
      @if (!mostrarCustom(t.id)) {
        <div class="selector-numeros">
          @for (n of numerosRapidos; track n) {
            <button
              type="button"
              class="btn-numero"
              [class.activo]="getCantidad(t.id) === n"
              (click)="elegirCantidad(t.id, n)">
              {{ n }}
            </button>
          }
          <button
            type="button"
            class="btn-numero btn-numero-mas"
            [class.activo]="getCantidad(t.id) > 10"
            title="Más de 10: te deja ingresar la cantidad exacta a mano"
            (click)="toggleCustom(t.id)">
            10+
          </button>
        </div>
      } @else {
        <div class="stepper-custom">
          <div class="stepper">
            <button type="button" class="btn-cant" (click)="decrementarCustom(t.id)" aria-label="Restar uno">−</button>
            <span class="stepper-cantidad">{{ getCantidad(t.id) }}</span>
            <button type="button" class="btn-cant" (click)="incrementarCustom(t.id)" aria-label="Sumar uno">+</button>
          </div>
          <button
            type="button"
            class="btn-volver-numeros"
            (click)="toggleCustom(t.id)"
            aria-label="Volver a los accesos rápidos"
            title="Volver a los accesos rápidos">
            ‹
          </button>
        </div>
      }
    </div>
  } @else {
    <!-- Sin precio por grupo: alcanza con un +/- simple. -->
    <div class="selector-tipo selector-simple">
      <div class="selector-header">
        <span class="selector-nombre">{{ t.nombre }}</span>
        <span class="selector-precio">{{ t.precio | pesos }}</span>
      </div>
      <div class="stepper">
        <button type="button" class="btn-cant" (click)="cambiarCantidad(t.id, -1)" aria-label="Quitar uno">−</button>
        <span class="stepper-cantidad">{{ getCantidad(t.id) }}</span>
        <button type="button" class="btn-cant" (click)="cambiarCantidad(t.id, 1)" aria-label="Agregar uno">+</button>
      </div>
    </div>
  }
}
