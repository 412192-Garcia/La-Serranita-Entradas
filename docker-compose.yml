# Orquesta los 3 contenedores para levantar todo en una máquina (VPS, o local para
# probar el build de producción antes de deployar). Las variables se leen de un archivo
# ".env" en esta misma carpeta — copiar .env.example, completar y no versionarlo.
#
# Uso:
#   cp .env.example .env   # completar los valores
#   docker compose up -d --build
#
# Primer arranque: no hay ningún usuario todavía (data.sql no corre en prod). Con
# BOOTSTRAP_ADMIN_USERNAME/PASSWORD seteados en el .env, el backend crea el primer
# ADMIN solo en el primer arranque (ver BootstrapAdminRunner).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serranita}
      POSTGRES_USER: ${POSTGRES_USER:-serranita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-serranita}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Back/La Serranita entradas
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-serranita}
      DB_USERNAME: ${POSTGRES_USER:-serranita}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_NOTIFICATION_URL: ${MP_NOTIFICATION_URL:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./Front
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80" # acceso directo sin pasar por Caddy — útil para probar local

  # HTTPS de verdad delante de todo (obligatorio para que Mercado Pago acepte el
  # webhook en producción): con DOMAIN seteado en el .env, pide y renueva el
  # certificado de Let's Encrypt solo. Ver Caddyfile.
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # docker-compose siempre define la variable en el contenedor, aunque quede vacía;
      # el "valor por defecto" de Caddy en el Caddyfile ({$CADDY_EMAIL:...}) sólo se usa
      # si la variable no existe, así que el fallback real tiene que ir acá.
      CADDY_EMAIL: ${CADDY_EMAIL:-noreply@example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
