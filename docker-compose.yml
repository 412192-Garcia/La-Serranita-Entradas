# Orquesta los 3 contenedores para levantar todo en una máquina (VPS, o local para
# probar el build de producción antes de deployar). Las variables se leen de un archivo
# ".env" en esta misma carpeta — copiar .env.example, completar y no versionarlo.
#
# Cada servicio con imagen propia tiene "image" Y "build": local, con el código fuente
# al lado, "docker compose up -d --build" construye igual que siempre. En el VPS (o
# cualquier lado sin el código fuente completo, sólo este archivo), "docker compose
# pull && docker compose up -d" baja las imágenes ya armadas por GitHub Actions
# (.github/workflows/ci.yml, job publish-images) en cada push a main — así el
# despliegue no necesita clonar el repo ni compilar nada.
#
# Uso local:
#   cp .env.example .env   # completar los valores
#   docker compose up -d --build
#
# Uso en el VPS (con .env ya cargado ahí):
#   docker compose pull
#   docker compose up -d
#
# Primer arranque: no hay ningún usuario todavía (data.sql no corre en prod). Con
# BOOTSTRAP_ADMIN_USERNAME/PASSWORD seteados en el .env, el backend crea el primer
# ADMIN solo en el primer arranque (ver BootstrapAdminRunner).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serranita}
      POSTGRES_USER: ${POSTGRES_USER:-serranita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-serranita}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backup de la base: pg_dump una vez por semana (por defecto miércoles 4 AM, con el parque cerrado) a
  # la carpeta backups/ del servidor, con la fecha en el nombre. Los de más de BACKUP_RETENCION_DIAS
  # se borran solos. El script vive acá adentro a propósito: el servidor sólo tiene este archivo,
  # el .env y afip/, no el repo. Restaurar: ver el comentario en .env.example.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-serranita}
      PGUSER: ${POSTGRES_USER:-serranita}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
      # Formato cron: minuto hora día-del-mes mes día-de-la-semana (1 = lunes, 3 = miércoles).
      BACKUP_CRON: ${BACKUP_CRON:-0 4 * * 3}
      BACKUP_RETENCION_DIAS: ${BACKUP_RETENCION_DIAS:-56}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /usr/local/bin/backup.sh <<'SCRIPT'
        #!/bin/sh
        set -e
        archivo="/backups/serranita-$$(date +%Y-%m-%d_%H%M).dump"
        # Formato custom (-Fc): comprimido y se restaura con pg_restore. Primero a .tmp, así un
        # backup cortado a la mitad nunca queda con el nombre de uno bueno.
        pg_dump -Fc -f "$$archivo.tmp"
        mv "$$archivo.tmp" "$$archivo"
        find /backups -name 'serranita-*.dump' -mtime +"$$BACKUP_RETENCION_DIAS" -delete
        echo "$$(date '+%Y-%m-%d %H:%M') backup OK: $$archivo ($$(du -h "$$archivo" | cut -f1))"
        SCRIPT
        chmod +x /usr/local/bin/backup.sh
        echo "$$BACKUP_CRON /usr/local/bin/backup.sh >> /proc/1/fd/1 2>&1" > /etc/crontabs/root
        echo "Backups programados: '$$BACKUP_CRON', se guardan $$BACKUP_RETENCION_DIAS días en ./backups"
        exec crond -f -l 8

  backend:
    image: ghcr.io/412192-garcia/la-serranita-backend:latest
    build:
      context: ./Back/La Serranita entradas
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-serranita}
      DB_USERNAME: ${POSTGRES_USER:-serranita}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-43200000}
      JWT_REMEMBER_EXPIRATION_MS: ${JWT_REMEMBER_EXPIRATION_MS:-1209600000}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_NOTIFICATION_URL: ${MP_NOTIFICATION_URL:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_STATEMENT_DESCRIPTOR: ${MP_STATEMENT_DESCRIPTOR:-LA SERRANITA}
      CHECKOUT_ABANDONADO_HORAS: ${CHECKOUT_ABANDONADO_HORAS:-3}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      # Casilla de reservas (comprobantes de compra, avisos de regalo). MAIL_USERNAME/MAIL_PASSWORD
      # son los nombres viejos: se siguen aceptando si las nuevas no están cargadas.
      MAIL_RESERVAS_USERNAME: ${MAIL_RESERVAS_USERNAME:-${MAIL_USERNAME:-}}
      MAIL_RESERVAS_PASSWORD: ${MAIL_RESERVAS_PASSWORD:-${MAIL_PASSWORD:-}}
      MAIL_COPIA: ${MAIL_COPIA:-}
      MAIL_FACTURAS_USERNAME: ${MAIL_FACTURAS_USERNAME:-}
      MAIL_FACTURAS_PASSWORD: ${MAIL_FACTURAS_PASSWORD:-}
      MAIL_FACTURAS_HOST: ${MAIL_FACTURAS_HOST:-}
      MAIL_FACTURAS_PORT: ${MAIL_FACTURAS_PORT:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      AFIPSDK_ACCESS_TOKEN: ${AFIPSDK_ACCESS_TOKEN:-}
      AFIP_ENVIRONMENT: ${AFIP_ENVIRONMENT:-dev}
      AFIP_CUIT: ${AFIP_CUIT:-20409378472}
      AFIP_CERT: ${AFIP_CERT:-}
      AFIP_KEY: ${AFIP_KEY:-}
      AFIP_PUNTO_VENTA_BOLETERIA: ${AFIP_PUNTO_VENTA_BOLETERIA:-1}
      AFIP_PUNTO_VENTA_ONLINE: ${AFIP_PUNTO_VENTA_ONLINE:-}
      AFIP_EMISOR_RAZON_SOCIAL: ${AFIP_EMISOR_RAZON_SOCIAL:-PARQUE RECREATIVO LA SERRANITA S.A.S.}
      AFIP_EMISOR_DOMICILIO: ${AFIP_EMISOR_DOMICILIO:-RUTA 5 KM43,5}
      AFIP_EMISOR_INGRESOS_BRUTOS: ${AFIP_EMISOR_INGRESOS_BRUTOS:-287116730}
      AFIP_EMISOR_INICIO_ACTIVIDADES: ${AFIP_EMISOR_INICIO_ACTIVIDADES:-30/11/2020}
      IMPRESION_AGENTE_TOKEN: ${IMPRESION_AGENTE_TOKEN:-}
      IMPRESION_QR_MODO: ${IMPRESION_QR_MODO:-nativo}
      IMPRESION_QR_PUNTOS: ${IMPRESION_QR_PUNTOS:-6}
    volumes:
      # Certificado y clave de ARCA (carpeta afip/ al lado de este archivo, sólo lectura). Con
      # AFIP_CERT=/run/afip/certificado.crt y AFIP_KEY=/run/afip/clave.key. Si la carpeta no
      # existe, Docker la crea vacía y no pasa nada. El backend corre como el usuario "app" del
      # contenedor: la clave tiene que ser legible por él (ver .env.example).
      - ./afip:/run/afip:ro
    # Sin ports: acá a propósito — en producción no hace falta, Caddy llega por la red
    # interna, y publicarlo en el host lo deja accesible desde internet salteando el
    # HTTPS. Para acceso directo en desarrollo local, ver docker-compose.override.yml.example.

  frontend:
    image: ghcr.io/412192-garcia/la-serranita-frontend:latest
    build:
      context: ./Front
    restart: unless-stopped
    depends_on:
      - backend
    # Ídem backend: sin ports: acá. docker-compose.override.yml.example lo publica sólo
    # en desarrollo local.

  # HTTPS de verdad delante de todo (obligatorio para que Mercado Pago acepte el
  # webhook en producción): con DOMAIN seteado en el .env, pide y renueva el
  # certificado de Let's Encrypt solo. Ver Caddyfile.
  caddy:
    image: ghcr.io/412192-garcia/la-serranita-caddy:latest
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # docker-compose siempre define la variable en el contenedor, aunque quede vacía;
      # el "valor por defecto" de Caddy en el Caddyfile ({$CADDY_EMAIL:...}) sólo se usa
      # si la variable no existe, así que el fallback real tiene que ir acá.
      CADDY_EMAIL: ${CADDY_EMAIL:-noreply@example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Sitios extra del host (ej. otro subdominio detrás del mismo Caddy) sin tocar el
      # Caddyfile del repo ni reconstruir la imagen — ver el "import" al final del Caddyfile.
      # Carpeta vacía acá; en el VPS puede tener archivos .caddy sueltos que no se versionan.
      - ./caddy-extra:/etc/caddy/extra:ro

volumes:
  db_data:
  caddy_data:
  caddy_config:
